<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="100%" height="100%" style="background:#ffffff; border-radius:12px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Break Statement Flow Diagram matching Page 46 -->
  <rect x="20" y="15" width="580" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Code Block simulation -->
  <rect x="40" y="30" width="280" height="320" rx="8" fill="#0f172a"/>
  
  <text x="60" y="65" fill="#38bdf8" font-size="14" font-family="monospace" font-weight="bold">while( condition check )</text>
  <text x="60" y="90" fill="#e2e8f0" font-size="14" font-family="monospace">{</text>
  <text x="80" y="115" fill="#94a3b8" font-size="14" font-family="monospace">statement-1;</text>
  <text x="80" y="140" fill="#94a3b8" font-size="14" font-family="monospace">statement-2;</text>
  <text x="80" y="165" fill="#facc15" font-size="14" font-family="monospace">if( some condition )</text>
  <text x="80" y="190" fill="#e2e8f0" font-size="14" font-family="monospace">{</text>
  <text x="110" y="215" fill="#f43f5e" font-size="16" font-family="monospace" font-weight="bold">break;</text>
  <text x="80" y="240" fill="#e2e8f0" font-size="14" font-family="monospace">}</text>
  <text x="80" y="265" fill="#64748b" font-size="14" font-family="monospace">statement-3;</text>
  <text x="80" y="290" fill="#64748b" font-size="14" font-family="monospace">statement-4;</text>
  <text x="60" y="320" fill="#e2e8f0" font-size="14" font-family="monospace">}</text>

  <!-- Arrow from break to outside the loop -->
  <path d="M 180 210 H 340 V 335 H 100" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="90,335 105,328 105,342" fill="#f43f5e"/>

  <!-- Description Card on Right -->
  <rect x="350" y="170" width="235" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="365" y="200" font-size="14" font-weight="bold" fill="#991b1b">Break Behavior:</text>
  <text x="365" y="224" font-size="12" fill="#b91c1c">Jumps out of the loop,</text>
  <text x="365" y="244" font-size="12" fill="#b91c1c">no matter how many cycles</text>
  <text x="365" y="264" font-size="12" fill="#b91c1c">are left, loop is exited.</text>
</svg>
