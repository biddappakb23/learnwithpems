<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" width="100%" height="100%" style="background:#ffffff; border-radius:12px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <!-- Title Header -->
  <rect x="25" y="20" width="600" height="46" rx="8" fill="#1e40af"/>
  <text x="325" y="50" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="0.5">Basic Structure of C Programs</text>

  <!-- Table Container Outline -->
  <rect x="25" y="75" width="600" height="380" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="2"/>

  <!-- Section 1: Documentation Section -->
  <rect x="35" y="85" width="580" height="42" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="50" y="112" fill="#0369a1" font-size="15" font-weight="bold">Documentation Section</text>
  <text x="260" y="112" fill="#64748b" font-size="13">/* Comments, Author, Date, Program Overview */</text>

  <!-- Section 2: Link Section -->
  <rect x="35" y="135" width="580" height="42" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="50" y="162" fill="#1d4ed8" font-size="15" font-weight="bold">Link Section</text>
  <text x="260" y="162" fill="#64748b" font-size="13">#include &lt;stdio.h&gt;, #include &lt;conio.h&gt;</text>

  <!-- Section 3: Definition Section -->
  <rect x="35" y="185" width="580" height="42" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="50" y="212" fill="#15803d" font-size="15" font-weight="bold">Definition Section</text>
  <text x="260" y="212" fill="#64748b" font-size="13">#define PI 3.14159, Macros / Symbolic Constants</text>

  <!-- Section 4: Global Declaration Section -->
  <rect x="35" y="235" width="580" height="42" rx="6" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
  <text x="50" y="262" fill="#a16207" font-size="15" font-weight="bold">Global Declaration Section</text>
  <text x="260" y="262" fill="#64748b" font-size="13">Global variables &amp; function prototypes</text>

  <!-- Section 5: main() Function Section -->
  <rect x="35" y="285" width="580" height="85" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="310" fill="#0f172a" font-size="15" font-weight="bold">main() Function Section</text>
  <text x="50" y="332" fill="#334155" font-size="14" font-family="monospace font-bold">{</text>
  <rect x="75" y="320" width="240" height="22" rx="4" fill="#e2e8f0"/>
  <text x="85" y="336" fill="#334155" font-size="12" font-weight="600">Declaration Part ;</text>
  <rect x="330" y="320" width="240" height="22" rx="4" fill="#e2e8f0"/>
  <text x="340" y="336" fill="#334155" font-size="12" font-weight="600">Executable Part ;</text>
  <text x="50" y="358" fill="#334155" font-size="14" font-family="monospace font-bold">}</text>

  <!-- Section 6: Subprogram Section -->
  <rect x="35" y="378" width="580" height="68" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="50" y="402" fill="#7e22ce" font-size="15" font-weight="bold">Subprogram Section</text>
  <text x="220" y="402" fill="#64748b" font-size="13">User Defined Functions: Function 1, Function 2, ... Function n</text>
  <text x="220" y="426" fill="#9333ea" font-size="12" font-family="monospace">void add() { ... } | int factorial(int n) { ... }</text>
</svg>
